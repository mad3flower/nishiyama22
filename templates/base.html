<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EC407A">
  <meta name="description" content="西山公園を音とGPSでめぐる探索型観光アプリ">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='splash.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='final-spec.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ver2.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='home-v21.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='clue.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='difficulty.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='splash-final.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <title>{% block title %}レッツさぁ西山！{% endblock %}</title>
</head>
<body>
  <main class="app-shell {% block shell_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% if request.endpoint != 'main.splash' %}{% include 'partials/bottom_nav.html' %}{% endif %}
  <div id="toast" class="toast-message" role="status"></div>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
